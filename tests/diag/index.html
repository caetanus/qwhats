<!doctype html>
<html><head><meta charset="utf-8"><title>qml-whats diag</title></head>
<body style="font:14px sans-serif;background:#111b21;color:#e9edef">
<h3>qml-whats — diagnóstico</h3>
<button id="pdfwin">abrir PDF (blob, janela nova)</button>
<button id="pdfdl">baixar PDF (blob)</button>
<button id="screen">compartilhar tela</button>
<div id="box" contenteditable="true" style="border:1px solid #555;min-height:40px">cole aqui</div>
<div class="two" style="display:flex;width:1000px;height:30px;position:relative"><div style="position:absolute;left:0;top:0;width:100%;height:100%;display:flex;pointer-events:none"><div id="ghost" style="flex:0 0 40%;max-width:40%"></div><div style="flex:1;border-left:1px solid red"></div></div><div id="pane" style="flex:0 0 40%;max-width:40%;background:#334"><div id="side">lista</div></div><div style="flex:1;background:#433">conversa</div></div>
<pre id="out"></pre>
<script>
const out = document.getElementById("out");
function log(...a) { const s = "DIAG " + a.join(" "); console.log(s); out.textContent += s + "\n"; }
// a one-page PDF, built by hand
function pdfBlob() {
  const objs = ["<< /Type /Catalog /Pages 2 0 R >>", "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 300 200] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>",
    null, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>"];
  const stream = "BT /F1 24 Tf 40 100 Td (qml-whats PDF ok) Tj ET";
  objs[3] = "<< /Length " + stream.length + " >>\nstream\n" + stream + "\nendstream";
  let pdf = "%PDF-1.4\n"; const offs = [];
  objs.forEach((o, i) => { offs.push(pdf.length); pdf += (i + 1) + " 0 obj\n" + o + "\nendobj\n"; });
  const x = pdf.length;
  pdf += "xref\n0 " + (objs.length + 1) + "\n0000000000 65535 f \n" + offs.map(o => String(o).padStart(10, "0") + " 00000 n \n").join("");
  pdf += "trailer\n<< /Size " + (objs.length + 1) + " /Root 1 0 R >>\nstartxref\n" + x + "\n%%EOF";
  return new Blob([pdf], { type: "application/pdf" });
}
function openPdf() { const u = URL.createObjectURL(pdfBlob()); const w = window.open(u, "_blank"); log("pdf window.open ->", w ? "window" : "null"); }
function downloadPdf() { const a = document.createElement("a"); a.href = URL.createObjectURL(pdfBlob()); a.download = "teste-qml-whats.pdf"; document.body.appendChild(a); a.click(); log("pdf download clicked"); }
document.getElementById("pdfwin").onclick = openPdf;
document.getElementById("pdfdl").onclick = downloadPdf;
document.getElementById("screen").onclick = () => navigator.mediaDevices.getDisplayMedia({ video: true })
  .then(s => log("display OK", s.getVideoTracks().map(t => t.label).join(",")), e => log("display FAIL", e.name, e.message));
(async () => {
  log("ua", navigator.userAgent);
  try {
    const d = navigator.userAgentData;
    log("uaData brands", d ? JSON.stringify(d.brands) : "none", "platform", d && d.platform, "mobile", d && d.mobile);
    if (d) log("uaData high", JSON.stringify(await d.getHighEntropyValues(["fullVersionList", "platformVersion", "architecture", "bitness", "model"])));
  } catch (e) { log("uaData FAIL", e.message); }
  const has = (o, k) => { try { return !!(o && k in o); } catch (e) { return false; } };
  log("features",
    "createEncodedStreams=" + has(window.RTCRtpSender && RTCRtpSender.prototype, "createEncodedStreams"),
    "RTCRtpScriptTransform=" + (typeof RTCRtpScriptTransform),
    "transform=" + has(window.RTCRtpSender && RTCRtpSender.prototype, "transform"),
    "MediaStreamTrackProcessor=" + (typeof MediaStreamTrackProcessor),
    "AudioWorklet=" + (typeof AudioWorkletNode),
    "SharedArrayBuffer=" + (typeof SharedArrayBuffer),
    "crossOriginIsolated=" + window.crossOriginIsolated,
    "WebTransport=" + (typeof WebTransport),
    "VideoEncoder=" + (typeof VideoEncoder), "AudioEncoder=" + (typeof AudioEncoder),
    "wasm=" + (typeof WebAssembly), "WebCodecs=" + (typeof VideoDecoder),
    "getDisplayMedia=" + has(navigator.mediaDevices, "getDisplayMedia"),
    "setSinkId=" + has(HTMLMediaElement.prototype, "setSinkId"),
    "serviceWorker=" + ("serviceWorker" in navigator), "permissions=" + ("permissions" in navigator));
  const mq = matchMedia("(prefers-color-scheme: dark)");
  log("scheme", mq.matches ? "dark" : "light");
  mq.addEventListener("change", () => log("scheme changed", mq.matches ? "dark" : "light"));
  log("secure", window.isSecureContext, "mediaDevices", !!navigator.mediaDevices, "RTCPeerConnection", typeof RTCPeerConnection);
  try { const d = await navigator.mediaDevices.enumerateDevices(); log("devices", d.map(x => x.kind).join(",")); } catch (e) { log("devices FAIL", e.name); }
  for (const c of [{ audio: true }, { video: true }]) {
    try { const s = await navigator.mediaDevices.getUserMedia(c); log("gum", JSON.stringify(c), "OK", s.getTracks().map(t => t.kind + ":" + t.label).join(","), "live", window.__qwLive); s.getTracks().forEach(t => t.stop()); log("after stop live", window.__qwLive); }
    catch (e) { log("gum", JSON.stringify(c), "FAIL", e.name, e.message); }
  }
  try { const pc = new RTCPeerConnection(); pc.addTransceiver("audio"); pc.addTransceiver("video"); const o = await pc.createOffer();
        log("rtc offer OK", /VP8/.test(o.sdp) ? "VP8" : "", /H264/.test(o.sdp) ? "H264" : "", /opus/.test(o.sdp) ? "opus" : ""); pc.close(); }
  catch (e) { log("rtc FAIL", e.name, e.message); }
  try { log("notification perm", await Notification.requestPermission()); } catch (e) { log("notif FAIL", e.name); }
  document.getElementById("box").addEventListener("paste", (e) => {
    const items = [...e.clipboardData.items].map(i => i.kind + ":" + i.type);
    log("paste event", items.join(","));
  });
  if (location.hash === "#clip") {
    setTimeout(async () => {
      log("focus", document.hasFocus());
      try { const its = await navigator.clipboard.read(); log("clipboard.read", its.map(i => i.types.join("+")).join(",")); }
      catch (e) { log("clipboard.read FAIL", e.name, e.message); }
      document.getElementById("box").focus();
      log("execCommand paste", document.execCommand("paste"));
      try {
        const c = document.createElement("canvas"); c.width = 64; c.height = 64; const g = c.getContext("2d"); g.fillStyle = "#21c063"; g.fillRect(0, 0, 64, 64);
        const blob = await new Promise(r => c.toBlob(r, "image/png"));
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        log("clipboard.write image OK");
      } catch (e) { log("clipboard.write FAIL", e.name, e.message); }
    }, 2500);
  }
  setTimeout(() => log("pane width " + Math.round(document.getElementById("pane").getBoundingClientRect().width) + " ghost " + Math.round(document.getElementById("ghost").getBoundingClientRect().width) + " of 1000 gpu=" + typeof navigator.gpu), 2500);
  if (location.hash === "#auto") { openPdf(); setTimeout(downloadPdf, 1500); }
})();
</script></body></html>
